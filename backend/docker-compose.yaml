# Portfolio API and its MongoDB, for Coolify (or any Docker host).
# Secrets come from the environment: set them in Coolify's environment
# variables, never in this file.
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    # A small cache: the data set is small and the host is shared (default is half the RAM).
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    # No ports: only the API, on this compose network, can reach the database.
    environment:
      # Root: for admin work by hand only (mongosh inside the container). The API never uses it.
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USERNAME:-root}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}"
      # The API's own user (readWrite on portfolio only), created by mongo/init-app-user.js on first start.
      MONGO_APP_USERNAME: "${MONGO_APP_USERNAME:-portfolio}"
      MONGO_APP_PASSWORD: "${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}"
      MONGO_APP_DATABASE: "portfolio"
    volumes:
      - mongo-data:/data/db
      - ./mongo/init-app-user.js:/docker-entrypoint-initdb.d/init-app-user.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Nightly dump of the database into the mongo-backups volume, newest 14 kept (mongo/backup.sh).
  mongo-backup:
    image: mongo:8.0
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["sh", "/backup.sh"]
    environment:
      # Same limited user as the API: it can read the portfolio database and nothing else.
      MONGO_APP_USERNAME: "${MONGO_APP_USERNAME:-portfolio}"
      MONGO_APP_PASSWORD: "${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}"
      BACKUP_KEEP: "${BACKUP_KEEP:-14}"
      BACKUP_AT_UTC: "${BACKUP_AT_UTC:-21:00}"
    volumes:
      - mongo-backups:/backups
      - ./mongo/backup.sh:/backup.sh:ro

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # Internal only: reach it through the Cloudflare Tunnel (Coolify's proxy or
    # cloudflared on this network). Publishing a host port would bypass
    # Cloudflare, and IsCloudflareTrusted would then let callers fake their IP.
    expose:
      - "8080"
    environment:
      # The mongo service above, as the API's own user. Use a URL-safe password (openssl rand -hex 32).
      Portfolio__Mongo__ConnectionString: "mongodb://${MONGO_APP_USERNAME:-portfolio}:${MONGO_APP_PASSWORD}@mongo:27017/portfolio?authSource=portfolio"
      Portfolio__Mongo__Database: "portfolio"
      Portfolio__Security__JwtSigningKey: "${JWT_SIGNING_KEY}"
      Portfolio__Security__EncryptionKey: "${ENCRYPTION_KEY}"
      Portfolio__Security__SetupToken: "${SETUP_TOKEN:-}"
      Portfolio__Security__AllowedOrigins__0: "https://dhucar.in"
      Portfolio__Security__IsCloudflareTrusted: "true"
      Portfolio__Passkeys__RpId: "dhucar.in"
      Portfolio__Passkeys__Origins__0: "https://dhucar.in"
      Portfolio__Site__RevalidateUrl: "https://dhucar.in/api/revalidate"
      Portfolio__Site__RevalidateSecret: "${REVALIDATE_SECRET}"
      # The deployed commit, reported by /health (Coolify: "Include Source Commit in Build").
      SOURCE_COMMIT: "${SOURCE_COMMIT:-}"

volumes:
  # The database files. Survives redeploys; removing this volume deletes the data.
  mongo-data:
  # The nightly dumps. On the same disk as the data: copy them elsewhere now and then.
  mongo-backups:

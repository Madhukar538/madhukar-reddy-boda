# Portfolio API for Coolify (or any Docker host). The database is MongoDB Atlas.
# Secrets come from the environment: set them in Coolify's environment
# variables, never in this file.
services:
  api:
    build: .
    restart: unless-stopped
    # Internal only: reach it through the Cloudflare Tunnel (Coolify's proxy or
    # cloudflared on this network). Publishing a host port would bypass
    # Cloudflare, and IsCloudflareTrusted would then let callers fake their IP.
    expose:
      - "8080"
    environment:
      # The Atlas connection string, e.g. mongodb+srv://USER:PASSWORD@cluster0.xxxxx.mongodb.net/?appName=Cluster0
      Portfolio__Mongo__ConnectionString: "${MONGO_CONNECTION_STRING}"
      Portfolio__Mongo__Database: "portfolio"
      Portfolio__Security__JwtSigningKey: "${JWT_SIGNING_KEY}"
      Portfolio__Security__EncryptionKey: "${ENCRYPTION_KEY}"
      Portfolio__Security__SetupToken: "${SETUP_TOKEN:-}"
      Portfolio__Security__AllowedOrigins__0: "https://dhucar.in"
      Portfolio__Security__IsCloudflareTrusted: "true"
      Portfolio__Passkeys__RpId: "dhucar.in"
      Portfolio__Passkeys__Origins__0: "https://dhucar.in"
      Portfolio__Site__RevalidateUrl: "https://dhucar.in/api/revalidate"
      Portfolio__Site__RevalidateSecret: "${REVALIDATE_SECRET}"
      # The deployed commit, reported by /health (Coolify: "Include Source Commit in Build").
      SOURCE_COMMIT: "${SOURCE_COMMIT:-}"
      # Optional: keeps this server's IP on the Atlas access list (for a home IP that changes).
      # An Atlas API key with the "Project Network Access Manager" role; leave empty to turn off.
      Portfolio__Atlas__PublicKey: "${ATLAS_PUBLIC_KEY:-}"
      Portfolio__Atlas__PrivateKey: "${ATLAS_PRIVATE_KEY:-}"
      Portfolio__Atlas__ProjectId: "${ATLAS_PROJECT_ID:-}"

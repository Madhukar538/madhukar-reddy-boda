# Checks every pull request and every push to main: the site's types and production build,
# and the API's test suite. Coolify deploys main on its own; this is the gate before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Site (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Also renders the résumé PDF (prebuild), so a broken résumé fails here too.
      - run: npm run build
      # Every look on the main pages, at desktop and phone widths (scripts/check-looks.mjs): each
      # keeps its look, shows its own blocks, doesn't scroll sideways on a phone and logs no errors.
      - run: npx playwright install --with-deps chromium
      - name: Check every look
        run: |
          npm start -- -p 3000 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
          BASE_URL=http://localhost:3000 node scripts/check-looks.mjs
          # Page weight budget (scripts/budget.json): fails if a main page's first load got heavier.
          BASE_URL=http://localhost:3000 node scripts/check-budget.mjs
      # The screenshots, one per look and page, to look through on any pull request.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: look-shots
          path: look-shots/
          retention-days: 14

  api:
    name: API (.NET tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # The tests start their own throwaway MongoDB (Mongo2Go): no services needed.
      - run: dotnet test Dhucar.Portfolio.sln --configuration Release

  backups:
    name: Backups (restore drill)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/mongo
    steps:
      - uses: actions/checkout@v4
      # The same image and backup.sh the server runs: a database with some data, one backup,
      # and its restore check into a throwaway MongoDB must pass with every collection back.
      - run: docker build -t portfolio-mongo .
      - name: Start a database with some data
        run: |
          docker network create drill
          docker run -d --name mongo --network drill \
            -e MONGO_INITDB_ROOT_USERNAME=root -e MONGO_INITDB_ROOT_PASSWORD=drill-root \
            -e MONGO_APP_USERNAME=portfolio -e MONGO_APP_PASSWORD=drill-app -e MONGO_APP_DATABASE=portfolio \
            portfolio-mongo mongod --wiredTigerCacheSizeGB 0.25
          for i in $(seq 1 60); do docker exec mongo healthcheck.sh && break; sleep 2; done
          docker exec mongo mongosh --quiet -u portfolio -p drill-app --authenticationDatabase portfolio portfolio --eval '
            db.posts.insertMany([{ _id: "a", title: "A" }, { _id: "b", title: "B" }]);
            db.profile.insertOne({ _id: "profile", name: "Drill" });
            db.pageViews.insertMany(Array.from({ length: 500 }, (_, i) => ({ _id: String(i), path: "/" })));
            db.getSiblingDB("site_drill").profile.insertOne({ _id: "profile", name: "Another site" });'
      - name: Back up once and restore-check it
        run: |
          mkdir -p backups status
          docker run --rm --network drill -e MONGO_APP_USERNAME=portfolio -e MONGO_APP_PASSWORD=drill-app -e BACKUP_ONCE=1 \
            -v "$PWD/backups:/backups" -v "$PWD/status:/status" --entrypoint backup.sh portfolio-mongo
          cat status/backup.json status/backup-good.json
          grep -q '"isOk":true' status/backup.json
          # Both sites: the main database and another site's, every collection and document back.
          grep -q '"databases":2' status/backup-good.json
          grep -q '"collections":4' status/backup-good.json
          grep -q '"documents":504' status/backup-good.json
          ls backups/portfolio-*.tar
      - if: failure()
        run: docker logs mongo | tail -50
